[package]
name = "livi-native-bt-dev"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[features]
default = []
isolated-helper = ["livi-native-handoff/isolated-development"]
development-receiver = []

[dependencies]
livi-aa.workspace = true
livi-link-host.workspace = true
livi-native-handoff = { path = "../livi-native-handoff" }
livi-runtime.workspace = true
livi-wifi.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }

[dev-dependencies]
livi-aa = { workspace = true, features = ["offline-admission-test-support"] }
tokio = { workspace = true, features = ["test-util"] }
